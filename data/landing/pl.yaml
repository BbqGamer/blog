headline: "AI, które pracuje"
headlineSecond: "na Twój biznes."
intro: "Wdrażam AI w firmach i tworzę aplikacje z funkcjami sztucznej inteligencji. Łączę programowanie, agentów AI i automatyzacje n8n, żeby usprawnić codzienną pracę Twojego zespołu."
cta: "Porozmawiajmy o Twoim projekcie"
explore: "Zobacz, w czym pomagam"
note: "Od pomysłu i wyboru technologii po działające wdrożenie."
servicesLabel: "Usługi"
servicesTitle: "Technologia dopasowana do Twoich procesów."
services:
  - label: "01 / AI w firmie"
    title: "Wdrożenia AI"
    text: "Pomagam wybrać procesy, w których AI ma sens, dobrać narzędzia i połączyć je z firmowymi systemami. Zaczynam od konkretnego problemu, nie od technologii."
  - label: "02 / Aplikacje"
    title: "Programowanie z AI"
    text: "Tworzę aplikacje i rozbudowuję istniejące produkty o funkcje AI — od pracy z dokumentami i wyszukiwania wiedzy po asystentów wspierających użytkowników."
  - label: "03 / Agenci"
    title: "Agenci AI"
    text: "Wdrażam agentów korzystających z firmowej wiedzy i narzędzi. Projektuję ich zadania, uprawnienia i miejsca, w których decyzję powinien zatwierdzić człowiek."
  - label: "04 / Automatyzacja"
    title: "n8n i integracje"
    text: "Łączę aplikacje, API i modele AI w automatyczne przepływy pracy. Ograniczam ręczne przenoszenie danych i powtarzalne zadania między systemami."
processLabel: "Współpraca"
processTitle: "Od potrzeby do rozwiązania."
steps:
  - title: "Rozmowa i zakres"
    text: "Poznaję Twój proces, dostępne dane i cel. Ustalamy, co warto zbudować i po czym poznamy, że działa."
  - title: "Prototyp i weryfikacja"
    text: "Sprawdzamy rozwiązanie na rzeczywistych przykładach, zanim przejdziemy do pełnego wdrożenia."
  - title: "Wdrożenie i integracja"
    text: "Łączę rozwiązanie z Twoimi narzędziami i przygotowuję je do codziennej pracy zespołu."
contactLabel: "Kontakt"
contactTitle: "Co możemy usprawnić w Twojej firmie?"
contactText: "Napisz, nad czym pracujesz lub jaki proces chcesz zautomatyzować. Ustalimy dobry punkt wyjścia."
taxLabel: "NIP"
blogLabel: "Blog techniczny"
blogTitle: "Od strony technicznej"
blogText: "Piszę też o programowaniu i technologii."
blogLink: "Przejdź do bloga"
