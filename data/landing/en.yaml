services:
  - label: "01 / AI for business"
    title: "AI implementation"
    text: "I help identify where AI makes sense, choose the right tools and connect them to your business systems. I start with a specific problem, not a technology."
  - label: "02 / Applications"
    title: "AI-powered software"
    text: "I build applications and add AI features to existing products — from document processing and knowledge search to assistants that support your users."
  - label: "03 / Agents"
    title: "AI agents"
    text: "I implement agents that use your company's knowledge and tools. I define their tasks, permissions and the points where a person should approve a decision."
  - label: "04 / Automation"
    title: "n8n and integrations"
    text: "I connect applications, APIs and AI models into automated workflows, reducing manual data entry and repetitive tasks across systems."
