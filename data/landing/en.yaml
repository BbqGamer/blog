    text: "I learn about your workflow, available data and goals. Together, we decide what to build and how to measure success."
  - title: "Prototype and validation"
    text: "We test the solution on real examples before moving on to a full implementation."
  - title: "Implementation and integration"
    text: "I connect the solution to your tools and prepare it for your team's day-to-day work."
  - title: "Maintenance and development"
    text: "After launch, I can provide ongoing monitoring, maintenance, AI model updates and further development, with the scope of support agreed around your needs."
